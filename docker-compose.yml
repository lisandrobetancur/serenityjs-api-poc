# Optional services for the @database and @localstack examples.
#
#   docker compose up -d
#   ENVIRONMENT=local DB_HOST=localhost DB_PORT=5433 DB_USER=postgres DB_PASSWORD=postgres npm test
#
# PostgreSQL is published on 5433 so it does not clash with a PostgreSQL already running on 5432.
services:
  api:
    image: ghcr.io/lisandrobetancur/prop-room-api:latest
    ports:
      - '8000:8000'

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./docker/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: dynamodb,s3,lambda,ecs,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
